name: data-lab

networks:
  labnet:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  clickhouse_data:
  qdrant_data:

services:

  # ---------------------------------------------------------------------
  # LAKEHOUSE: MinIO (S3), Iceberg REST catalog, Trino
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    networks: [labnet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mc-init:
    image: minio/mc:latest
    container_name: mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/lakehouse &&
      echo 'bucket lakehouse pronto'
      "
    networks: [labnet]

  postgres:
    image: postgres:16
    container_name: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks: [labnet]

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    depends_on:
      mc-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH-STYLE-ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      # Por padrão o catálogo é em memória (some ao reiniciar o container).
      # Para persistir metadados entre restarts, descomente e use o DB "iceberg_catalog":
      # CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      # CATALOG_JDBC_USER: postgres
      # CATALOG_JDBC_PASSWORD: postgres
    ports:
      - "8181:8181"
    networks: [labnet]

  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on: [iceberg-rest]
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks: [labnet]

  # ---------------------------------------------------------------------
  # STREAMING: Kafka (KRaft, sem Zookeeper), Schema Registry, Debezium
  # ---------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"  # cliente externo (fora do docker network)
    networks: [labnet]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks: [labnet]

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on: [kafka, postgres, schema-registry]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    ports:
      - "8083:8083"
    networks: [labnet]

  # ---------------------------------------------------------------------
  # FLINK
  # ---------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.19
    container_name: flink-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    ports:
      - "8091:8081"  # UI (8081 já é usado pelo Schema Registry no host)
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar
      - ./flink/lib/iceberg-flink-runtime-1.19-1.9.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.19-1.9.2.jar
      - ./flink/lib/flink-s3-fs-hadoop-1.19.3.jar:/opt/flink/lib/flink-s3-fs-hadoop-1.19.3.jar
      - ./flink/lib/hadoop-hdfs-client-3.3.4.jar:/opt/flink/lib/hadoop-hdfs-client-3.3.4.jar
      - ./flink/lib/iceberg-aws-bundle-1.9.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.9.2.jar
    networks: [labnet]

  flink-taskmanager:
    image: flink:1.19
    container_name: flink-taskmanager
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots: 2"
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar
      - ./flink/lib/iceberg-flink-runtime-1.19-1.9.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.19-1.9.2.jar
      - ./flink/lib/flink-s3-fs-hadoop-1.19.3.jar:/opt/flink/lib/flink-s3-fs-hadoop-1.19.3.jar
      - ./flink/lib/hadoop-hdfs-client-3.3.4.jar:/opt/flink/lib/hadoop-hdfs-client-3.3.4.jar
      - ./flink/lib/iceberg-aws-bundle-1.9.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.9.2.jar
    networks: [labnet]

  # ---------------------------------------------------------------------
  # ORQUESTRAÇÃO: Airflow (modo standalone, só para prática)
  # ---------------------------------------------------------------------
  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow
    depends_on: [postgres]
    command: bash -c "airflow standalone"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    ports:
      - "8085:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    networks: [labnet]

  # ---------------------------------------------------------------------
  # OLAP
  # ---------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: clickhouse
    ports:
      - "8123:8123"  # HTTP
      - "9004:9000"  # protocolo nativo (9000 já é usado pelo MinIO no host)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [labnet]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------------------------------------------------------------------
  # VECTOR DB
  # ---------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # HTTP/REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [labnet]

  # ---------------------------------------------------------------------
  # VISUALIZAÇÃO
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    networks: [labnet]

  # ---------------------------------------------------------------------
  # APACHE PINOT (OLAP real-time)
  # ---------------------------------------------------------------------
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    environment:
      ZOO_MY_ID: 1
    ports:
      - "2181:2181"
    networks: [labnet]

  pinot-controller:
    image: apachepinot/pinot:1.1.0
    container_name: pinot-controller
    command: StartController -zkAddress zookeeper:2181 -dataDir /data
    depends_on: [zookeeper]
    ports:
      - "9002:9000"  # 9000 já é usado pelo MinIO no host
    networks: [labnet]

  pinot-broker:
    image: apachepinot/pinot:1.1.0
    container_name: pinot-broker
    command: StartBroker -zkAddress zookeeper:2181
    depends_on: [pinot-controller]
    ports:
      - "8099:8099"
    networks: [labnet]

  pinot-server:
    image: apachepinot/pinot:1.1.0
    container_name: pinot-server
    command: StartServer -zkAddress zookeeper:2181
    depends_on: [pinot-broker]
    networks: [labnet]
